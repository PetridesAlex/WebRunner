<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | WebRunner Agency</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The page you requested could not be found on WebRunner Agency." />
    <link rel="canonical" href="https://www.webrunneragency.com/" />
    <meta name="theme-color" content="#ff6a00" />
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070708;
        --text: #f4f3f1;
        --muted: #9a9690;
        --accent: #ff6a00;
        --font: 'Outfit', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: radial-gradient(ellipse 70% 50% at 20% 0%, rgba(255, 106, 0, 0.16), transparent 55%),
          linear-gradient(168deg, #0a0908 0%, #060504 42%, #020201 100%);
        color: var(--text);
        font-family: var(--font);
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      p.eyebrow {
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.75rem;
        font-weight: 600;
        color: #ffc98a;
        margin: 0 0 1rem;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 2.75rem);
        margin: 0 0 1rem;
        font-weight: 600;
      }
      p.lead {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1.75rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        background: linear-gradient(127deg, #b84a00, #ff6a00);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      a:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p class="lead">That URL does not exist on WebRunner Agency.</p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
